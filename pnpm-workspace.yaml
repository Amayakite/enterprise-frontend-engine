# 使用预编译的文件监听模块；不运行这两个非必需的安装脚本。
allowBuilds:
  "@parcel/watcher": false
  es5-ext: false
  # Reka UI 的间接依赖，安装时匹配本项目的 Vue 3 入口。
  vue-demi: true
minimumReleaseAgeExclude:
  - "@docx-editor.dev/core@2.22.0"
  - "@docx-editor.dev/fonts@2.22.0"
  - "@docx-editor.dev/i18n@2.22.0"
  - "@docx-editor.dev/vue@2.22.0"
